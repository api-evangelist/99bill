aid: 99bill
name: 99Bill
description: >-
  99Bill Corporation (快钱, Kuaiqian) is one of China's leading independent
  third-party electronic payment service providers, offering a comprehensive
  suite of online payment, mobile payment, and settlement solutions for
  merchants and enterprises. Its Kuaiqian Merchant Open Platform
  (open.99bill.com) exposes standardized payment interfaces over common
  internet protocols, covering protocol/agreement (card-free) payments,
  online banking (B2C and B2B) payments, and WeChat Official Account and
  Mini-Program payments, with SDKs and demo code published for Java, PHP, and
  .NET. Developers select a product in the Product Center, build against a
  sandbox using provided demos, then contact 99Bill business staff to activate
  a production merchant account (issued MerchantAcctID and product keys) before
  going live. 99Bill was surfaced as a portfolio company of DCM Ventures and is
  profiled here in the API Evangelist network. No public OpenAPI, AsyncAPI, or
  package-registry SDK was found during enrichment; developer resources are
  distributed through the authenticated open platform and help center.
